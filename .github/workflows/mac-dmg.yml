# Builds macOS .dmg installers (Java runtime bundled via jpackage) for a client
# release and attaches them to that release. jpackage cannot cross-compile, so
# this must run on macOS runners — one Apple Silicon build, one Intel build.
name: Build Mac DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Client release tag to build from and attach the DMGs to (e.g. client-v8)"
        required: true
        default: "client-v8"

permissions:
  contents: write

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            suffix: AppleSilicon
          - runner: macos-13
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download release jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir input
          gh release download "${{ inputs.tag }}" -p Kyros.jar -R "${{ github.repository }}" -D input

      - name: Build .icns icon
        run: |
          mkdir kyros.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s .github/assets/kyros-icon.png --out kyros.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) .github/assets/kyros-icon.png --out kyros.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns kyros.iconset -o kyros.icns

      - name: Build DMG
        run: |
          VER="${{ inputs.tag }}"
          VER="${VER#client-v}"
          jpackage --type dmg --name Kyros \
            --app-version "${VER}.0.0" \
            --input input \
            --main-jar Kyros.jar \
            --main-class net.runelite.client.RuneLite \
            --icon kyros.icns \
            --java-options "-ea" \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --mac-package-name Kyros \
            --dest out
          mv out/Kyros-*.dmg "Kyros-Mac-${{ matrix.suffix }}.dmg"
          ls -la "Kyros-Mac-${{ matrix.suffix }}.dmg"

      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "Kyros-Mac-${{ matrix.suffix }}.dmg" --clobber -R "${{ github.repository }}"
